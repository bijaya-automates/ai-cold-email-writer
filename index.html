
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>AI Cold Email Writer</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 40px 16px;
      font-family: Arial, Helvetica, sans-serif;
      background: #f3f5fb;
      color: #202943;
    }

    .container {
      max-width: 720px;
      margin: 0 auto;
      padding: 35px;
      background: #ffffff;
      border: 1px solid #e5e9f2;
      border-radius: 18px;
      box-shadow: 0 12px 35px rgba(35, 48, 85, 0.08);
    }

    .top-label {
      display: inline-block;
      padding: 7px 13px;
      border-radius: 20px;
      background: #eeeaff;
      color: #6952cb;
      font-size: 12px;
      font-weight: bold;
      letter-spacing: 1px;
    }

    h1 {
      margin: 18px 0 8px;
      text-align: center;
      font-size: 34px;
      color: #202943;
    }

    h1 span {
      color: #7059d7;
    }

    .subtitle {
      margin-bottom: 30px;
      text-align: center;
      color: #78829a;
      font-size: 15px;
      line-height: 1.5;
    }

    .section-title {
      margin: 25px 0 16px;
      color: #53617e;
      font-size: 13px;
      font-weight: bold;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    label {
      display: block;
      margin: 17px 0 8px;
      color: #34415d;
      font-size: 14px;
      font-weight: 600;
    }

    input,
    textarea,
    select {
      width: 100%;
      padding: 13px 14px;
      border: 1px solid #dce2ee;
      border-radius: 9px;
      background: #fbfcff;
      color: #29344d;
      font-size: 15px;
      font-family: inherit;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    input:focus,
    textarea:focus,
    select:focus {
      border-color: #8876e5;
      box-shadow: 0 0 0 3px rgba(136, 118, 229, 0.12);
    }

    textarea {
      min-height: 95px;
      resize: vertical;
      line-height: 1.5;
    }

    .hint {
      display: block;
      margin-top: 6px;
      color: #8a93a8;
      font-size: 12px;
    }

    .generate-btn {
      width: 100%;
      margin-top: 27px;
      padding: 16px;
      border: none;
      border-radius: 10px;
      background: linear-gradient(100deg, #7358df, #477fe5);
      color: #ffffff;
      font-size: 16px;
      font-weight: bold;
      letter-spacing: 0.5px;
      cursor: pointer;
      transition: transform 0.2s, opacity 0.2s;
    }

    .generate-btn:hover {
      transform: translateY(-2px);
    }

    .generate-btn:disabled {
      cursor: not-allowed;
      opacity: 0.65;
      transform: none;
    }

    #status {
      margin-top: 18px;
      text-align: center;
      font-size: 14px;
      color: #596781;
      line-height: 1.5;
    }

    .result-card {
      display: none;
      margin-top: 25px;
      padding: 20px;
      border: 1px solid #e1e5f1;
      border-radius: 12px;
      background: #f8f9fd;
    }

    .result-card h2 {
      margin: 0 0 15px;
      color: #33415f;
      font-size: 18px;
    }

    #emailResult {
      min-height: 150px;
      color: #303d57;
      font-size: 15px;
      line-height: 1.7;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .copy-btn {
      display: none;
      width: 100%;
      margin-top: 14px;
      padding: 13px;
      border: 1px solid #c9c2f2;
      border-radius: 9px;
      background: #eeeaff;
      color: #6651be;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
    }

    .footer {
      margin-top: 28px;
      text-align: center;
      color: #9aa2b4;
      font-size: 12px;
    }

    @media (max-width: 600px) {
      body {
        padding: 20px 12px;
      }

      .container {
        padding: 23px 18px;
      }

      h1 {
        font-size: 28px;
      }
    }
  </style>
</head>

<body>

  <main class="container">

    <div style="text-align:center;">
      <span class="top-label">AI POWERED WRITING</span>
    </div>

    <h1>AI <span>Cold Email</span> Writer</h1>

    <p class="subtitle">
      Create personalized, professional and engaging cold emails with AI.
    </p>

    <form id="emailForm">

      <div class="section-title">01 — Prospect Details</div>

      <label for="recipientName">Target Prospect Name *</label>
      <input
        type="text"
        id="recipientName"
        placeholder="e.g. John Smith"
        required
      >

      <label for="recipientEmail">Target Email Address *</label>
      <input
        type="email"
        id="recipientEmail"
        placeholder="e.g. john@company.com"
        required
      >

      <label for="company">Company Name *</label>
      <input
        type="text"
        id="company"
        placeholder="e.g. ABC Technologies"
        required
      >

      <div class="section-title">02 — Your Offer</div>

      <label for="purpose">What's the Offer? *</label>
      <textarea
        id="purpose"
        placeholder="Describe the service, product or opportunity you want to offer..."
        required
      ></textarea>

      <div class="section-title">03 — Your Information</div>

      <label for="yourName">Your Name *</label>
      <input
        type="text"
        id="yourName"
        placeholder="Enter your name"
        required
      >

      <label for="background">Your Professional Background *</label>
      <textarea
        id="background"
        placeholder="Describe your skills, experience or business..."
        required
      ></textarea>

      <label for="tone">Choose Email Tone</label>
      <select id="tone">
        <option value="Professional">Professional</option>
        <option value="Friendly">Friendly</option>
        <option value="Confident">Confident</option>
        <option value="Formal">Formal</option>
      </select>

      <button
        type="submit"
        class="generate-btn"
        id="generateBtn"
      >
        GENERATE COLD EMAIL ✦
      </button>

    </form>

    <p id="status" aria-live="polite"></p>

    <section class="result-card" id="resultCard">
      <h2>Your Generated Email</h2>
      <div id="emailResult"></div>
    </section>

    <button
      type="button"
      class="copy-btn"
      id="copyBtn"
    >
      COPY EMAIL
    </button>

    <div class="footer">
      Built with AI • OpenAI API • n8n Automation
    </div>

  </main>

  <script>
    // We will add our n8n Production Webhook URL later.
    const webhookUrl = "http://localhost:5678/webhook/5930fdee-d94a-41ae-9811-4af73c76ad05";

    const form = document.getElementById("emailForm");
    const status = document.getElementById("status");
    const generateBtn = document.getElementById("generateBtn");
    const resultCard = document.getElementById("resultCard");
    const emailResult = document.getElementById("emailResult");
    const copyBtn = document.getElementById("copyBtn");

    form.addEventListener("submit", async function(event) {
      event.preventDefault();

      if (webhookUrl === "PASTE_N8N_PRODUCTION_WEBHOOK_URL_HERE") {
        status.textContent = "Please connect your n8n webhook first.";
        return;
      }

      const formData = {
        recipientName: document.getElementById("recipientName").value.trim(),
        recipientEmail: document.getElementById("recipientEmail").value.trim(),
        company: document.getElementById("company").value.trim(),
        purpose: document.getElementById("purpose").value.trim(),
        yourName: document.getElementById("yourName").value.trim(),
        background: document.getElementById("background").value.trim(),
        tone: document.getElementById("tone").value
      };

      generateBtn.disabled = true;
      generateBtn.textContent = "GENERATING EMAIL...";
      status.textContent = "Your AI email is being prepared...";

      resultCard.style.display = "none";
      copyBtn.style.display = "none";

      try {
        const result = await fetch(webhookUrl, {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify(formData)
        });

        if (!result.ok) {
          throw new Error("Request failed: " + result.status);
        }

        const contentType = result.headers.get("content-type") || "";
        let emailText;

        if (contentType.includes("application/json")) {
          const data = await result.json();
          emailText = data.output || data.email || data.text || JSON.stringify(data, null, 2);
        } else {
          emailText = await result.text();
        }

        emailResult.textContent = emailText;
        resultCard.style.display = "block";
        copyBtn.style.display = "block";
        status.textContent = "Your cold email has been generated successfully!";

      } catch (error) {
        console.error("Cold email error:", error);
        status.textContent = "Connection failed. Please check n8n and webhook settings.";

      } finally {
        generateBtn.disabled = false;
        generateBtn.textContent = "GENERATE COLD EMAIL ✦";
      }
    });

    copyBtn.addEventListener("click", async function() {
      try {
        await navigator.clipboard.writeText(emailResult.textContent);
        status.textContent = "Email copied successfully!";
      } catch (error) {
        status.textContent = "Copy failed. Please copy the email manually.";
      }
    });
  </script>

</body>
</html>
